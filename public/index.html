<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>귀갓길</title>
  <meta name="description" content="KSPO DOME 현장 귀가 안내. 목적지 입력 없이 방면만 고르면 탈 곳을 보여 줍니다 (공모전 시연용)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="map" role="img" aria-label="한얼광장에서 정류장까지 걸어가는 길 지도"></div>

  <header class="top">
    <p class="clock"><b id="mode">시연</b><time id="clock"></time></p>
    <button type="button" class="live" id="modeBtn"></button>
  </header>

  <main class="sheet" id="sheet">
    <button type="button" class="grip" id="grip" aria-label="안내판 올리기·내리기" aria-expanded="true"></button>
    <div class="scroll" id="view"><p class="pad">불러오는 중…</p></div>
    <div class="cta"><button type="button" id="cta" hidden></button></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
